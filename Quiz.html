        }

            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

            border-radius: 10px;
            font-size: 14px;
            background: rgba(255,255,255,0.9);
            color: #333;
        }
        .student-info input:focus {

            transform: scale(1.02);
        }
        .timer-box {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            background: rgba(255,215,0,0.2);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px solid #ffd700;
        }
        .timer-box.warning {
            background: rgba(255,0,0,0.3);
            border-color: #ff4444;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            border-radius: 5px;
            transition: width 0.3s ease;
        }
        .question-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            margin: 15px 0;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        .q-dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255,255,255,0.3);
            color: white;
        }
        .q-dot.answered { background: #28a745; }
        .q-dot.current { background: #ffd700; color: #333; transform: scale(1.2); }
        .q-dot:hover { transform: scale(1.1); }
        .question-card {
            background: rgba(255,255,255,0.95);
            color: #333;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .question-card:hover { transform: translateY(-2px); }
        .question-number {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .options label {
            display: block;
            padding: 10px 15px;
            margin: 8px 0;
            background: #f0f0f0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .options label:hover {
            background: #e0e0ff;
            border-color: #667eea;
        }
        .options input[type="radio"] {
            margin-right: 10px;
            transform: scale(1.2);
        }
        .options label.selected {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: #ffd700;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #333;
        }
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255,215,0,0.4);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.3); }

            color: white;
        }

            transform: scale(1.05);

            border-radius: 20px;
            text-align: center;

<body>
    <div class="quiz-container">
        <div class="header">
            <h1>📝 MS Word 2010 Quiz</h1>
            <p>Complete Test - 100 Questions | Time: 60 Minutes</p>
        </div>

            <input type="text" id="studentRoll" placeholder="🎫 Registration Number" required>
            <input type="text" id="studentClass" placeholder="🏫 Class/Section" required>
            <input type="date" id="examDate" required>
            <input type="text" id="examCenter" placeholder="📍 Exam Center">
            <input type="email" id="studentEmail" placeholder="📧 Email (Optional)">
        </div>

        <div class="timer-box" id="timerBox">
            ⏱️ Time Remaining: <span id="timer">60:00</span>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>

        <div class="question-nav" id="questionNav"></div>

        <div id="quizSection">

            <div class="nav-buttons">
                <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">⬅️ Previous</button>
                <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">Next ➡️</button>
                <button class="btn btn-success hidden" id="submitBtn" onclick="submitQuiz()">✅ Submit Quiz</button>
            </div>
        </div>

        <div id="resultSection" class="result-card">
            <h2>🎉 Quiz Completed!</h2>
            <div class="score-circle" id="scoreCircle">0</div>
            <p style="font-size: 20px; margin: 10px 0;">
                <span id="scoreText">You scored 0 out of 100</span>
                <span id="percentageText">(0%)</span>
            </p>
            <div id="gradeBadge"></div>
            <div style="margin: 20px 0;">
                <p>⏱️ Time Taken: <span id="timeTaken">--</span></p>
                <p>✅ Correct: <span id="correctCount">0</span> | ❌ Wrong: <span id="wrongCount">0</span> | ⏭️ Skipped: <span id="skippedCount">0</span></p>
            </div>
            <div class="export-section">
                <h3>📊 Export Results</h3>
                <button class="export-btn export-excel" onclick="exportToExcel()">📗 Export to Excel</button>
                <button class="export-btn export-pdf" onclick="exportToPDF()">📄 Export to PDF</button>
                <button class="export-btn export-csv" onclick="exportToCSV()">📋 Export to CSV</button>
            </div>
            <div style="margin-top: 20px;">
                <button class="btn btn-primary" onclick="showReview()">🔍 Review Answers</button>
                <button class="btn btn-secondary" onclick="restartQuiz()">🔄 Retake Quiz</button>
            </div>
            <div id="reviewSection" style="display:none; margin-top: 20px; text-align: left; max-height: 400px; overflow-y: auto;">
                <h3 style="color: #667eea; text-align: center;">Answer Review</h3>
                <div id="reviewList"></div>
            </div>
        </div>
    </div>

];

let currentQuestion = 0;
let userAnswers = new Array(questions.length).fill(-1);
let timerInterval;
let timeRemaining = 3600;
let startTime;
let examData = {};

function init() {
  document.getElementById('examDate').valueAsDate = new Date();
  renderQuestionNav();
  showQuestion(0);
  startTimer();
  startTime = new Date();
}

function renderQuestionNav() {
  const nav = document.getElementById('questionNav');
  nav.innerHTML = '';
  for (let i = 0; i < questions.length; i++) {
    const dot = document.createElement('div');
    dot.className = 'q-dot' + (userAnswers[i] !== -1 ? ' answered' : '') + (i === currentQuestion ? ' current' : '');
    dot.textContent = i + 1;
    dot.onclick = () => showQuestion(i);
    nav.appendChild(dot);
  }
}

function showQuestion(index) {
  currentQuestion = index;
  const q = questions[index];
  const container = document.getElementById('questionContainer');
  let optionsHtml = '';
  q.options.forEach((opt, i) => {
    const selected = userAnswers[index] === i ? 'selected' : '';
    optionsHtml += `<label class="${selected}" onclick="selectOption(${i})">
      <input type="radio" name="q${index}" value="${i}" ${selected ? 'checked' : ''}>
      ${String.fromCharCode(65 + i)}. ${opt}
    </label>`;
  });
  container.innerHTML = `
    <div class="question-card">
      <span class="question-number">Question ${index + 1} of ${questions.length}</span>
      <h3 style="margin: 15px 0; font-size: 18px;">${q.q}</h3>
      <div class="options">
        ${optionsHtml}
      </div>
    </div>
  `;
  document.getElementById('prevBtn').style.display = index === 0 ? 'none' : 'inline-block';
  document.getElementById('nextBtn').style.display = index === questions.length - 1 ? 'none' : 'inline-block';
  document.getElementById('submitBtn').classList.toggle('hidden', index !== questions.length - 1);
  renderQuestionNav();
  updateProgress();
}

function selectOption(optionIndex) {
  userAnswers[currentQuestion] = optionIndex;
  showQuestion(currentQuestion);
}

function nextQuestion() {
  if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1);
}

function prevQuestion() {
  if (currentQuestion > 0) showQuestion(currentQuestion - 1);
}

function updateProgress() {
  const answered = userAnswers.filter(a => a !== -1).length;
  const percent = (answered / questions.length) * 100;
  document.getElementById('progressFill').style.width = percent + '%';
}

function startTimer() {
  timerInterval = setInterval(() => {
    timeRemaining--;
    const mins = Math.floor(timeRemaining / 60);
    const secs = timeRemaining % 60;
    document.getElementById('timer').textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    if (timeRemaining <= 300) document.getElementById('timerBox').classList.add('warning');
    if (timeRemaining <= 0) { clearInterval(timerInterval); submitQuiz(); }
  }, 1000);
}

function submitQuiz() {
  clearInterval(timerInterval);
  let correct = 0, wrong = 0, skipped = 0;
  userAnswers.forEach((ans, i) => {
    if (ans === -1) skipped++;
    else if (ans === questions[i].correct) correct++;
    else wrong++;
  });
  const percentage = Math.round((correct / questions.length) * 100);
  const timeTaken = formatTime(3600 - timeRemaining);
  examData = {
    name: document.getElementById('studentName').value || 'Unknown',
    roll: document.getElementById('studentRoll').value || 'N/A',
    class: document.getElementById('studentClass').value || 'N/A',
    date: document.getElementById('examDate').value || new Date().toISOString().split('T')[0],
    center: document.getElementById('examCenter').value || 'N/A',
    email: document.getElementById('studentEmail').value || 'N/A',
    correct: correct, wrong: wrong, skipped: skipped, total: questions.length,
    percentage: percentage, timeTaken: timeTaken,
    answers: userAnswers.map((ans, i) => ({
      q: questions[i].q,
      userAns: ans === -1 ? 'Skipped' : questions[i].options[ans],
      correctAns: questions[i].options[questions[i].correct],
      isCorrect: ans === questions[i].correct
    }))
  };
  document.getElementById('quizSection').style.display = 'none';
  document.getElementById('studentForm').style.display = 'none';
  document.getElementById('timerBox').style.display = 'none';
  document.getElementById('progressFill').parentElement.style.display = 'none';
  document.getElementById('questionNav').style.display = 'none';
  const resultSection = document.getElementById('resultSection');
  resultSection.style.display = 'block';
  document.getElementById('scoreCircle').textContent = percentage + '%';
  document.getElementById('scoreText').textContent = `You scored ${correct} out of ${questions.length}`;
  document.getElementById('percentageText').textContent = `(${percentage}%)`;
  document.getElementById('timeTaken').textContent = timeTaken;
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('skippedCount').textContent = skipped;
  let grade = '', badgeClass = '';
  if (percentage >= 90) { grade = 'A+ (Excellent)'; badgeClass = 'badge-pass'; }
  else if (percentage >= 80) { grade = 'A (Very Good)'; badgeClass = 'badge-pass'; }
  else if (percentage >= 70) { grade = 'B (Good)'; badgeClass = 'badge-pass'; }
  else if (percentage >= 60) { grade = 'C (Average)'; badgeClass = 'badge-pass'; }
  else if (percentage >= 50) { grade = 'D (Pass)'; badgeClass = 'badge-pass'; }
  else { grade = 'F (Fail)'; badgeClass = 'badge-fail'; }
  document.getElementById('gradeBadge').innerHTML = `<span class="badge ${badgeClass}">${grade}</span>`;
}

function formatTime(seconds) {
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  return `${mins}m ${secs}s`;
}

function showReview() {
  const reviewSection = document.getElementById('reviewSection');
  const reviewList = document.getElementById('reviewList');
  if (reviewSection.style.display === 'none') {
    reviewSection.style.display = 'block';
    let html = '';
    examData.answers.forEach((item, i) => {
      const statusClass = item.isCorrect ? 'correct' : 'incorrect';
      const statusIcon = item.isCorrect ? '✅' : '❌';
      html += `<div class="review-item ${statusClass}">
          <strong>Q${i+1}: ${item.q}</strong><br>
          <span style="color: ${item.isCorrect ? 'green' : 'red'}">
            ${statusIcon} Your Answer: ${item.userAns}
          </span><br>
          ✅ Correct Answer: ${item.correctAns}
        </div>`;
    });
    reviewList.innerHTML = html;
  } else { reviewSection.style.display = 'none'; }
}

function exportToExcel() {
  let csv = 'MS Word 2010 Quiz Results\n\n';
  csv += 'Student Information\n';
  csv += `Name,${examData.name}\n`;
  csv += `Roll Number,${examData.roll}\n`;
  csv += `Class,${examData.class}\n`;
  csv += `Date,${examData.date}\n`;
  csv += `Center,${examData.center}\n`;
  csv += `Email,${examData.email}\n\n`;
  csv += 'Result Summary\n';
  csv += `Total Questions,${examData.total}\n`;
  csv += `Correct,${examData.correct}\n`;
  csv += `Wrong,${examData.wrong}\n`;
  csv += `Skipped,${examData.skipped}\n`;
  csv += `Percentage,${examData.percentage}%\n`;
  csv += `Time Taken,${examData.timeTaken}\n\n`;
  csv += 'Detailed Answers\n';
  csv += 'Q.No,Question,Your Answer,Correct Answer,Status\n';
  examData.answers.forEach((item, i) => {
    const status = item.isCorrect ? 'Correct' : (item.userAns === 'Skipped' ? 'Skipped' : 'Wrong');
    csv += `${i+1},"${item.q}","${item.userAns}","${item.correctAns}",${status}\n`;
  });
  const blob = new Blob([csv], { type: 'application/vnd.ms-excel' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `MS_Word_2010_Quiz_${examData.name}_${examData.date}.xls`;
  a.click();
  URL.revokeObjectURL(url);
  alert('✅ Results exported to Excel successfully!');
}

function exportToPDF() {
  let content = `MS WORD 2010 QUIZ RESULTS\n\n`;
  content += `STUDENT INFORMATION\n`;
  content += `Name: ${examData.name}\n`;
  content += `Roll: ${examData.roll}\n`;
  content += `Class: ${examData.class}\n`;
  content += `Date: ${examData.date}\n`;
  content += `Center: ${examData.center}\n\n`;
  content += `RESULTS\n`;
  content += `Score: ${examData.correct}/${examData.total} (${examData.percentage}%)\n`;
  content += `Correct: ${examData.correct} | Wrong: ${examData.wrong} | Skipped: ${examData.skipped}\n`;
  content += `Time: ${examData.timeTaken}\n\n`;
  content += `DETAILED ANSWERS:\n`;
  examData.answers.forEach((item, i) => {
    const status = item.isCorrect ? '✓' : '✗';
    content += `Q${i+1}: ${status} ${item.q}\n`;
    content += `   Your: ${item.userAns} | Correct: ${item.correctAns}\n\n`;
  });
  const blob = new Blob([content], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `MS_Word_2010_Quiz_${examData.name}_${examData.date}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  alert('✅ Results exported to Text/PDF format!');
}

function exportToCSV() {
  let csv = 'Q.No,Question,Your Answer,Correct Answer,Status\n';
  examData.answers.forEach((item, i) => {
    const status = item.isCorrect ? 'Correct' : (item.userAns === 'Skipped' ? 'Skipped' : 'Wrong');
    csv += `${i+1},"${item.q}","${item.userAns}","${item.correctAns}",${status}\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `MS_Word_2010_Quiz_${examData.name}_${examData.date}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  alert('✅ Results exported to CSV successfully!');
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart the quiz? All progress will be lost.')) location.reload();
}

init();
</script>
</body>
</html>
